<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Radio — Listen to radio stations around the globe</title>
  <meta name="description" content="Explore an interactive world map and tune into local radio broadcasts from cities around the globe. Free world radio scanner." />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>" />
</head>
<body>
  <!-- Header -->
  <header id="header">
    <div class="header-left">
      <span class="logo">📻</span>
      <h1>World Radio</h1>
    </div>
    <div class="header-right">
      <button id="btn-scanner" class="header-btn" title="Radio Scanner (S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h4l3-9 4 18 3-9h6"/></svg>
        Scanner
      </button>
      <button id="btn-surprise" class="header-btn" title="Random Station">
        🎲 Surprise Me
      </button>
      <a href="https://github.com" class="header-btn" target="_blank" rel="noopener" title="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.38.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .1-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 016.02 0c2.28-1.55 3.28-1.23 3.28-1.23.66 1.66.25 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.82.58C20.56 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg>
      </a>
    </div>
  </header>

  <!-- Map -->
  <div id="map"></div>

  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div class="loading-spinner"></div>
    <p>Tuning into the world...</p>
  </div>

  <!-- Scanner Overlay -->
  <div id="scanner-overlay">
    <div class="scanner-content">
      <div class="scanner-header">
        <h2>World Radio Scanner</h2>
        <button id="scanner-close" class="scanner-btn-close" title="Close (S)">&times;</button>
      </div>
      <div class="scanner-freq">
        <div id="scanner-freq-line" class="freq-line"></div>
        <div class="freq-ticks"></div>
      </div>
      <div class="scanner-region-nav">
        <button id="scanner-prev-region" class="scanner-btn">&laquo; Prev</button>
        <span id="scanner-region-name" class="scanner-region">Worldwide</span>
        <button id="scanner-next-region" class="scanner-btn">Next &raquo;</button>
      </div>
      <p id="scanner-status" class="scanner-status">Starting scan...</p>
      <div class="scanner-controls">
        <button id="scanner-toggle" class="scanner-btn primary">Pause</button>
        <button id="scanner-skip" class="scanner-btn">Skip &raquo;</button>
      </div>
    </div>
  </div>

  <!-- Player Bar -->
  <div id="player-bar">
    <div class="player-controls">
      <button id="btn-prev" class="player-btn" title="Previous (←)">
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="19,20 9,12 19,4"/><rect x="5" y="4" width="3" height="16"/></svg>
      </button>
      <button id="btn-play" class="player-btn play-btn" title="Play/Pause (Space)">
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
      </button>
      <button id="btn-next" class="player-btn" title="Next (→)">
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,4 15,12 5,20"/><rect x="16" y="4" width="3" height="16"/></svg>
      </button>
    </div>
    <div class="player-info">
      <div id="station-name" class="station-name">Click a station on the map to start listening</div>
      <div id="station-meta" class="station-meta"></div>
    </div>
    <div class="player-volume">
      <svg viewBox="0 0 24 24" fill="currentColor" class="volume-icon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <input type="range" id="volume-slider" min="0" max="100" value="70" class="volume-slider" />
    </div>
    <div id="freq-bar" class="freq-bar">
      <div class="freq-bar-inner"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
